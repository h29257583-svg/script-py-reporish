name: Check recorder setup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check private cookie binding without contacting YouTube
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
        run: python3 check_setup.py
      - name: Save small setup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-check
          path: setup-check.json
          retention-days: 1
